<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kisan Queue — Procurement Scheduling</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
</head>
<body>

<div class="app">
  <div class="side">
    <div class="brand">Kisan<span>Queue</span></div>
    <div class="brand-sub">Procurement scheduling for<br>Dept. of Consumer Affairs, Food &amp; Public Distribution</div>
    <button class="nav-btn active" data-view="booking"><span class="nav-dot"></span> <span data-i18n="navBooking">Farmer Booking</span></button>
    <button class="nav-btn" data-view="dashboard"><span class="nav-dot"></span> <span data-i18n="navDashboard">Manager Dashboard</span></button>
    <button class="nav-btn" data-view="log"><span class="nav-dot"></span> <span data-i18n="navLog">Notification Log</span></button>
  </div>

  <div class="main-wrap">
    <div class="topbar">
      <span class="topbar-globe">🌐</span>
      <select id="lang-select" class="lang-select">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
      </select>
    </div>
    <div class="main" id="view-content"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
